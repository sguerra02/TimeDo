<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Do Now</title>
<script>
  try {
    var s = JSON.parse(localStorage.getItem("donow.settings.v1")) || {};
    if (s.theme) document.documentElement.setAttribute("data-theme", s.theme);
  } catch (e) {}
</script>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="brand-mark">◧</span>
    <span class="brand-name">Do Now</span>
  </div>
  <nav class="tabs" id="tabs">
    <button class="tab" data-view="main">Home</button>
    <button class="tab" data-view="new">New</button>
    <button class="tab" data-view="archive">Archive</button>
  </nav>
  <div class="io">
    <button class="tbtn" id="themeBtn" title="Themes" aria-label="Themes">◑</button>
    <button class="tbtn" id="exportBtn" title="Download all data as JSON">Export</button>
    <button class="tbtn" id="importBtn" title="Load data from a JSON file">Import</button>
    <input type="file" id="importFile" accept="application/json,.json" hidden>
  </div>
</header>

<main class="wrap">

  <!-- HOME: Do Now + Days Since -->
  <section class="view" id="view-main" hidden>
    <div class="chips subtabs" id="mainSubtabs">
      <button class="chip" data-mainkind="now">Do Now</button>
      <button class="chip" data-mainkind="days">Days Since</button>
    </div>

    <div id="pane-now" class="pane">
      <div class="panel filterbar">
        <label class="field-inline">
          <span class="lbl">I have</span>
          <input type="number" id="nowMinutes" min="0" step="1" placeholder="all" inputmode="numeric">
        </label>
        <div class="chips" id="unitChips">
          <button class="chip" data-unit="min">min</button>
          <button class="chip" data-unit="hr">hr</button>
        </div>
        <div class="chips" id="minuteChips"></div>
        <button class="chip toggle" id="packToggle" title="Suggest a set of tasks that fits your total time">Fit to budget</button>
        <span class="seg-lbl">sort</span>
        <div class="chips" id="sortChips">
          <button class="chip" data-sort="priority">Priority</button>
          <button class="chip" data-sort="time">Shortest</button>
          <button class="chip" data-sort="age">Oldest</button>
        </div>
        <span class="count" id="nowCount"></span>
      </div>
      <div id="nowList" class="list"></div>
    </div>

    <div id="pane-days" class="pane" hidden>
      <div class="panel filterbar">
        <label class="field-inline"><input type="checkbox" id="showHidden"> <span class="lbl">Show hidden</span></label>
        <span class="count" id="daysCount"></span>
      </div>
      <div id="daysList" class="list"></div>
    </div>
  </section>

  <!-- NEW -->
  <section class="view" id="view-new" hidden>
    <div class="chips subtabs" id="newSubtabs">
      <button class="chip" data-newkind="task">Task</button>
      <button class="chip" data-newkind="day">Days Since</button>
    </div>
    <form class="panel form" id="taskForm" autocomplete="off">
      <div class="row">
        <label class="field">
          <span class="lbl">Label</span>
          <input type="text" id="f-label" maxlength="120" required placeholder="What needs doing">
        </label>
      </div>
      <div class="row two">
        <label class="field">
          <span class="lbl">Time (minutes)</span>
          <input type="number" id="f-minutes" min="1" step="1" required placeholder="e.g. 20" inputmode="numeric">
        </label>
        <label class="field">
          <span class="lbl">Priority <span class="hint">5 = highest</span></span>
          <select id="f-priority">
            <option value="5">5</option>
            <option value="4">4</option>
            <option value="3" selected>3</option>
            <option value="2">2</option>
            <option value="1">1</option>
          </select>
        </label>
      </div>
      <div class="row">
        <label class="field">
          <span class="lbl">Description</span>
          <textarea id="f-desc" rows="4" maxlength="2000" placeholder="Details, steps, links"></textarea>
        </label>
      </div>
      <div class="row actions-row">
        <button type="submit" class="btn btn-accent">Add task</button>
        <button type="reset" class="btn btn-ghost">Clear</button>
      </div>
    </form>
    <form class="panel form" id="dayForm" autocomplete="off" hidden>
      <div class="row two">
        <label class="field">
          <span class="lbl">Title</span>
          <input type="text" id="d-title" maxlength="120" required placeholder="e.g. Water the plants">
        </label>
        <label class="field">
          <span class="lbl">Goal (days)</span>
          <input type="number" id="d-goal" min="1" step="1" required placeholder="e.g. 3" inputmode="numeric">
        </label>
      </div>
      <div class="row">
        <label class="field">
          <span class="lbl">Notes</span>
          <textarea id="d-notes" rows="2" maxlength="2000" placeholder="Optional"></textarea>
        </label>
      </div>
      <div class="row actions-row">
        <button type="submit" class="btn btn-accent">Add tracker</button>
        <button type="reset" class="btn btn-ghost">Clear</button>
      </div>
    </form>
  </section>

  <!-- THEMES -->
  <section class="view" id="view-themes" hidden>
    <div class="themes-head"><span class="lbl">Choose a theme</span></div>
    <div id="themeList" class="theme-list"></div>
  </section>

  <!-- ARCHIVE -->
  <section class="view" id="view-archive" hidden>
    <div class="panel filterbar">
      <div class="chips" id="archiveChips">
        <button class="chip" data-status="all">All</button>
        <button class="chip" data-status="completed">Completed</button>
        <button class="chip" data-status="abandoned">Abandoned</button>
      </div>
      <span class="count" id="archiveCount"></span>
    </div>
    <div id="archiveList" class="list"></div>
  </section>

</main>

<!-- EDIT MODAL -->
<div class="modal-backdrop" id="modal" hidden>
  <div class="modal panel" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <h2 id="modalTitle" class="modal-title">Edit task</h2>
    <div class="row">
      <label class="field">
        <span class="lbl">Label</span>
        <input type="text" id="e-label" maxlength="120">
      </label>
    </div>
    <div class="row two">
      <label class="field">
        <span class="lbl">Time (minutes)</span>
        <input type="number" id="e-minutes" min="1" step="1" inputmode="numeric">
      </label>
      <label class="field">
        <span class="lbl">Priority <span class="hint">5 = highest</span></span>
        <select id="e-priority">
          <option value="5">5</option>
          <option value="4">4</option>
          <option value="3">3</option>
          <option value="2">2</option>
          <option value="1">1</option>
        </select>
      </label>
    </div>
    <div class="row">
      <label class="field">
        <span class="lbl">Description</span>
        <textarea id="e-desc" rows="4" maxlength="2000"></textarea>
      </label>
    </div>
    <div class="row actions-row">
      <button class="btn btn-accent" id="modalSave">Save changes</button>
      <button class="btn btn-ghost" id="modalCancel">Cancel</button>
    </div>
  </div>
</div>

<!-- DAY EDIT MODAL -->
<div class="modal-backdrop" id="dayModal" hidden>
  <div class="modal panel" role="dialog" aria-modal="true" aria-labelledby="dayModalTitle">
    <h2 id="dayModalTitle" class="modal-title">Edit tracker</h2>
    <div class="row">
      <label class="field">
        <span class="lbl">Title</span>
        <input type="text" id="de-title" maxlength="120">
      </label>
    </div>
    <div class="row two">
      <label class="field">
        <span class="lbl">Goal (days)</span>
        <input type="number" id="de-goal" min="1" step="1" inputmode="numeric">
      </label>
      <label class="field">
        <span class="lbl">Last completed</span>
        <input type="date" id="de-date">
      </label>
    </div>
    <div class="row">
      <label class="field">
        <span class="lbl">Notes</span>
        <textarea id="de-notes" rows="4" maxlength="2000"></textarea>
      </label>
    </div>
    <div class="row actions-row">
      <button class="btn btn-accent" id="dayModalSave">Save changes</button>
      <button class="btn btn-ghost" id="dayModalCancel">Cancel</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="app.js"></script>
</body>
</html>
